syntax = "proto3";

package flipcash.profile.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/profile/v1;profilepb";
option java_package = "com.codeinc.flipcash.gen.profile.v1";
option objc_class_prefix = "FPBProfileV1";

import "blob/v1/model.proto";
import "common/v1/common.proto";
import "moderation/v1/model.proto";
import "profile/v1/model.proto";
import "validate/validate.proto";

service Profile {
	rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

	rpc SetDisplayName(SetDisplayNameRequest) returns (SetDisplayNameResponse);

	// SetUsername sets the caller's username, replacing any username already
	// set.
	rpc SetUsername(SetUsernameRequest) returns (SetUsernameResponse);

	// SetProfilePicture sets the caller's profile picture to a blob they have
	// already uploaded via BlobStorage, replacing any picture already set.
	//
	// The client uploads only the ORIGINAL — InitiateExternalUpload, PUT/POST
	// the bytes, then (optionally) CompleteExternalUpload — and passes the
	// resulting BlobId here once the blob is READY. The server derives the
	// DISPLAY and THUMBNAIL renditions itself and returns the full set.
	rpc SetProfilePicture(SetProfilePictureRequest) returns (SetProfilePictureResponse);

	// UpdateTipCard updates the caller's Tip Card customization. Every field is
	// optional; only the ones set in the request are changed.
	rpc UpdateTipCard(UpdateTipCardRequest) returns (UpdateTipCardResponse);

	// LinkSocialAccount links a social account to a user
	rpc LinkSocialAccount(LinkSocialAccountRequest) returns (LinkSocialAccountResponse);

	// UnlinkSocialAccount removes a social account link from a user
	rpc UnlinkSocialAccount(UnlinkSocialAccountRequest) returns (UnlinkSocialAccountResponse);
}

message GetProfileRequest {
	// The user whose profile is being fetched, identified either by their user
	// ID or by their username. Exactly one must be set.
	oneof identifier {
		option (validate.required) = true;

		common.v1.UserId   user_id  = 1;
		common.v1.Username username = 3;
	}

	// Optional auth to retrieve private profile information for self
	common.v1.Auth auth = 2;
}

message GetProfileResponse {
	Result result = 1;
	enum Result {
		OK        = 0;
		NOT_FOUND = 1;
	}

	// UserProfile, if found.
	//
	// Some fields may or may not be set, depending on the scope of request
	// in the future.
	UserProfile user_profile = 2;
}

message SetDisplayNameRequest {
	// DisplayName is the new name to set.
	string display_name = 1 [(validate.rules).string = {
		min_len: 1
		max_len: 64
	}];

	common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message SetDisplayNameResponse {
	Result result = 1;
	enum Result {
		OK                   = 0;
		INVALID_DISPLAY_NAME = 1;
		DENIED               = 2;
		FAILED_MODERATED     = 3;
	}

	// The best-fit category that tripped moderation, mirroring the Moderation
    // service's vocabulary. Set only when result == FAILED_MODERATED; NONE
	// otherwise.
    moderation.v1.FlaggedCategory flagged_category = 2;
}

message SetUsernameRequest {
	// Username is the new username to set.
	common.v1.Username username = 1 [(validate.rules).message.required = true];

	common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message SetUsernameResponse {
	Result result = 1;
	enum Result {
		OK                   = 0;
		INVALID_USERNAME     = 1;
		DENIED               = 2;
		ALREADY_TAKEN        = 3;
		FAILED_MODERATED     = 4;
		INSUFFICIENT_BALANCE = 5;
		RESERVED_WORD        = 6;
	}

	// The best-fit category that tripped moderation, mirroring the Moderation
	// service's vocabulary. Set only when result == FAILED_MODERATED; NONE
	// otherwise.
	moderation.v1.FlaggedCategory flagged_category = 2;
}

message SetProfilePictureRequest {
	// The blob holding the ORIGINAL image the caller uploaded. It must be owned
	// by the caller and READY; the server derives the remaining renditions from
	// it. A blob may back at most one profile picture — reuse is not implied.
	blob.v1.BlobId blob_id = 1 [(validate.rules).message.required = true];

	common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message SetProfilePictureResponse {
	Result result = 1;
	enum Result {
		OK             = 0;
		DENIED         = 1;
		BLOB_NOT_FOUND = 2; // no such blob, or it is not owned by the caller
		BLOB_NOT_READY = 3; // blob is still PENDING/PROCESSING; retry once READY
		BLOB_REJECTED  = 4; // blob failed validation or moderation; terminal for this id, so the client must upload again
		INVALID_BLOB   = 5; // blob is READY but unusable as a picture (e.g. not an image)
	}

	// The caller's new profile picture, including the renditions the server
	// derived. Set only when result == OK.
	blob.v1.Media profile_picture = 2;
}

message UpdateTipCardRequest {
	// The new colour of the Tip Card. Left unchanged when unset.
	common.v1.Color color = 1;

	common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message UpdateTipCardResponse {
	Result result = 1;
	enum Result {
		OK            = 0;
		DENIED        = 1;
		INVALID_COLOR = 2;
	}
}

message LinkSocialAccountRequest {
	LinkingToken linking_token = 1 [(validate.rules).message.required = true];

	message LinkingToken {
		oneof type {
			option (validate.required) = true;

			XLinkingToken x = 1;
		}

		message XLinkingToken {
			// X access token from the OAuth 2.0 flow
			string access_token = 1[(validate.rules).string = {
				min_len: 1
				max_len: 4096 // todo: arbitrary
			}];
		}
	}

	common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message LinkSocialAccountResponse {
	Result result = 1;
	enum Result {
		OK                    = 0;
		INVALID_LINKING_TOKEN = 1;
		EXISTING_LINK         = 2;
		DENIED                = 3;
	}

	SocialProfile social_profile = 2;
}

message UnlinkSocialAccountRequest {
	oneof social_identifier {
		option (validate.required) = true;

		string x_user_id = 1 [(validate.rules).string = {
			max_len: 32
		}];
	}

	common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message UnlinkSocialAccountResponse {
	Result result = 1;
	enum Result {
		OK     = 0;
		DENIED = 1;
	}
}
