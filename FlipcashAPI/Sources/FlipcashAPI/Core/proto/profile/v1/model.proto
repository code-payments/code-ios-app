syntax = "proto3";

package flipcash.profile.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/profile/v1;profilepb";
option java_package = "com.codeinc.flipcash.gen.profile.v1";
option objc_class_prefix = "FPBProfileV1";

import "blob/v1/model.proto";
import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

message UserProfile {
	// The ID of the user this profile belongs to. Always set, so a caller that
	// looked the profile up by username learns the user's ID from the response.
	common.v1.UserId user_id = 9 [(validate.rules).message.required = true];

	// Display name is the display name of the user (if found).
	string display_name = 1 [(validate.rules).string = {
		min_len: 0
		max_len: 64
	}];

	// The user's username on Flipcash. Public, so it is returned for any user,
	// not just the caller. Unset when the user hasn't claimed one yet.
	common.v1.Username username = 8;

	// Social profiles are links to external social accounts
	repeated SocialProfile social_profiles = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 1
    }];


    // Phone number linked to this user. This is private and will only be returned
    // when the requesting user asks for their own profile
    common.v1.PhoneNumber phone_number = 3;

    // Email address linked to this user. This is private and will only be returned
    // when the requesting user asks for their own profile
    common.v1.EmailAddress email_address = 4;

    // The user's profile picture, as the set of renditions it is stored as —
    // typically a DISPLAY for the profile view and a THUMBNAIL for avatars in
    // member rows and chat lists.
    //
    // Unset when the user has not set a picture. Set it with SetProfilePicture.
    //
    // To fetch the bytes of ANOTHER user's picture, the caller does not own
    // these blobs, so a GetBlobs call must carry a blob.v1.AccessContext whose
    // `profile` scope names this user. A caller reading its own needs none.
    blob.v1.Media profile_picture = 5;

    // Timestamp the user joined Flipcash
    google.protobuf.Timestamp join_ts = 6 [(validate.rules).timestamp.required = true];

    // How the user has customized their Tip Card. Public, so it is returned for
    // any user, not just the caller. Always set — the server resolves defaults
    // for anything the user hasn't customized. Update it with UpdateTipCard.
    TipCardCustomization tip_card_customization = 7 [(validate.rules).message.required = true];
}

message SocialProfile {
	oneof type {
		option (validate.required) = true;

		XProfile x = 1;
	}
}

message XProfile {
    // The user's ID on X
    string id = 1 [(validate.rules).string = {
        min_len: 1
        max_len: 32
    }];

    // The user's username on X
    string username = 2 [(validate.rules).string = {
        min_len: 1
        max_len: 15
    }];

    // The user's friendly name on X
    string name = 3 [(validate.rules).string = {
        max_len: 256
    }];

	// The user's description on X
	string description = 4 [(validate.rules).string = {
        max_len: 4096 // todo: arbitrary
    }];

    // URL to the user's X profile picture
    string profile_pic_url = 5 [(validate.rules).string = {
        min_len: 1
        max_len: 2048 // todo: arbitrary
    }];

    // The type of X verification associated with the user
    VerifiedType verified_type = 6;
    enum VerifiedType {
        NONE       = 0;
        BLUE       = 1;
        BUSINESS   = 2;
        GOVERNMENT = 3;
    }

    // The number of followers the user has on X
    uint32 follower_count = 7;    
}

// Customization for a Tip Card
message TipCardCustomization {
    // The colour of the Tip Card. Always set — the server falls back to the
    // default colour when the user hasn't picked one.
    common.v1.Color color = 1 [(validate.rules).message.required = true];
}
