syntax = "proto3";

package flipcash.push.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/push/v1;pushpb";
option java_package = "com.codeinc.flipcash.gen.push.v1";
option objc_class_prefix = "FPBPushV1";

import "chat/v1/model.proto";
import "common/v1/common.proto";
import "validate/validate.proto";

enum TokenType {
    UNKNOWN = 0;
    // FCM registration token for an Android device
    FCM_ANDROID = 1;
    // FCM registration token or an iOS device
    FCM_APNS = 2;
}

// Payload provided as extra data in a push
message Payload {
    // If present, where the app should navigate to after clicking the push
    Navigation navigation = 1;

    // Ordered substitutions to apply to push title
    repeated common.v1.Substitution title_substitutions = 2;

    // Ordered substitutions to apply to push body
    repeated common.v1.Substitution body_substitutions = 3;

    // Push notification category
    Category category = 4;
    enum Category {
        DEFAULT            = 0;
        DEPOSIT_WITHDRAWAL = 1;
        BUY_SELL           = 2;
        GAIN               = 3;
        CHAT               = 4;
        CONTACT_JOIN       = 5;
    }

    // Push notification key for grouping pushes. If not set, then no grouping
    // is applied.
    string group_key = 5 [(validate.rules).string = {
        max_len: 4096 // Arbitrary
    }];

    ChatMetadata chat_metadata = 6;
}

// Navigation within the app upon clicking the push
message Navigation {
    oneof type {
        option (validate.required) = true;

        // Currency info page for the provided mint 
        common.v1.PublicKey currency_info = 1;

        // Chat for the provided ID
        common.v1.ChatId chat_id = 2;

        // Chat for a contact with the provided phone number
        common.v1.PhoneNumber chat_contact_phone_number = 3;
    }
}
// Additional metadata provided for chat pushes
message ChatMetadata {
    // The user ID that sent a chat message
    //
    // Note: This will not be set for system messages OR for notifications that
    //       don't relate to a user
    common.v1.UserId sending_user_id = 1;

    // The type of chat
    chat.v1.ChatType type = 2 [(validate.rules).enum = {
        not_in: [0] // UNKNOWN
    }];
}
