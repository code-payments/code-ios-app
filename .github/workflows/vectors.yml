name: Cross-platform vector gate

# Asserts this repo reproduces the canonical fixtures in the orchestrator's
# `code/test-vectors/` — the same fixtures code-android-app asserts against. The
# two apps compute keys, signatures, and on-chain amounts in parallel Swift and
# Kotlin implementations; these vectors are what keeps the answers identical.
#
# Two jobs, each under one name on every event so either can be a required check:
#
#   "Vectors"                   -- the two vector packages. About 5 minutes.
#   "Flipcash build and tests"  -- builds the app and runs all of FlipcashTests.
#                                  Off pull_request it also runs the UI smoke test,
#                                  which reports but does not gate.
#
# Two packages because they cannot share a deployment target: FlipcashCore's
# transitive deps (BigDecimal, grpc/nio) pull a macOS floor that CrossPlatformVectors
# does not want. Both run on a simulator — the ed25519 under test moved from a
# host-buildable C package to the shared Kotlin XCFramework, which ships iOS only.

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Only PR runs are superseded by a newer push. A push to main that cancelled its
# predecessor would also cancel the run that seeds the DerivedData cache (caches
# saved on main are the only ones other branches can read).
concurrency:
  group: vectors-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- vectors --
  vectors:
    name: Vectors
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # FlipcashCore is swift-tools 6.1, which the image's default Xcode may
      # predate. Take the newest installed rather than pinning a version that
      # can drop out of the runner image.
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version

      # Cold, FlipcashCore vectors spent 6-10 minutes compiling grpc/nio/protobuf.
      # Both packages build into ./.derived, which holds the compiled products and
      # the SwiftPM clones. A restore-key hit still saves under the new key, so a
      # manifest change refreshes it. PR runs can only read caches saved on main
      # or on their own PR ref.
      - name: Restore DerivedData
        uses: actions/cache@v4
        with:
          path: .derived
          key: vectors-dd-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved', '!.derived/**') }}
          restore-keys: |
            vectors-dd-${{ runner.os }}-

      # Simulator model names turn over with each runner image, so pick whatever
      # iPhone is installed rather than naming one.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) for x in d[r] if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Ed25519 vectors
        working-directory: CrossPlatformVectors
        run: |
          xcodebuild test -scheme CrossPlatformVectors-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/ed25519" \
            -quiet

      - name: FlipcashCore vectors
        working-directory: FlipcashCoreVectors
        run: |
          xcodebuild test -scheme FlipcashCoreVectors \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/core" \
            -quiet

  # ------------------------------------------------------------- app build --
  app:
    name: Flipcash build and tests
    runs-on: macos-15
    # The app build and its 1664 tests took 22 of the previous 30 on a quiet
    # run, which leaves nothing for a slow runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version

      # Hashed before the build: afterwards .derived/ holds the SwiftPM checkouts,
      # whose Package.swift files would change the hash.
      - name: Cache key
        id: key
        run: echo "dd=app-dd-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      # Restored everywhere, saved only off pull_request: a multi-GB cache per PR
      # push would evict the main-branch seed that every PR starts from. Checkout
      # gives every source a new mtime, so the app and test targets rebuild anyway;
      # what the cache saves is the built SwiftPM packages. Without it, the build
      # reached FlipcashCore after 16.6 minutes instead of 1.3.
      - name: Restore app DerivedData
        uses: actions/cache/restore@v4
        with:
          path: .derived/app
          key: ${{ steps.key.outputs.dd }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.key.outputs.dd }}-
            app-dd-${{ runner.os }}-

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) for x in d[r] if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Builds both test targets (FlipcashTests and FlipcashUITests) once for the
      # test steps below. The build runs -quiet (unquieted it prints every compile
      # command, which on its own pushed this job past its timeout), while the test
      # runs do not, because -quiet there reduces a failure to "Test case ... failed"
      # with no assertion text to act on. CI never reads the index store.
      - name: App build
        run: |
          xcodebuild build-for-testing -scheme Flipcash \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/app" \
            -skipMacroValidation \
            -quiet \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Save app DerivedData
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .derived/app
          key: ${{ steps.key.outputs.dd }}-${{ github.sha }}

      # Booted after the build, not during it: on the 3-core runner, runs that
      # booted during the build compiled every phase 1.7-2.7x slower.
      - name: Boot the simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      # All of FlipcashTests, and any failure fails the job. That includes the
      # app target's own vector suites -- chat drafts, link detection, and chat
      # media -- which assert against types only the app has, so they cannot move
      # into either package. Their fixtures are canonical and code-android-app
      # asserts against the same ones, so a failure there is contract drift
      # between the platforms.
      #
      # Serial: in parallel, Swift Testing starts all ~3,600 cases at once in the one
      # test host, and on the 3-core runner a case can wait over 60 s for the main
      # actor or the cooperative pool before its first line runs. That wait counts
      # against .timeLimit and wall-clock checks, so cases that take 20 ms alone
      # failed at 60 s (runs 41647682095, 41651458792). Serial, the suite's test
      # time is about 110 s and no case takes over 2.2 s.
      - name: App tests
        run: |
          xcodebuild test-without-building -scheme Flipcash \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/app" \
            -parallel-testing-enabled NO \
            -only-testing:FlipcashTests \
            -skip-testing:"$QUARANTINED" \
            -resultBundlePath "${{ runner.temp }}/AppTests.xcresult"
        env:
          QUARANTINED: FlipcashTests/AttachPanelPlacementTests/openPanel_sitsAbovePlus()

      # Cases that fail every time on this runner's Xcode and pass locally on a newer
      # one, run on their own so they still report without failing the job. Fix and
      # move each back into "App tests". openPanel_sitsAbovePlus: its 90 s waitUntil
      # never sees the open panel's pixels above the bar on Xcode 26.3 (3 of 3 tries,
      # run 41674530406); it passes in about 2 s on Xcode 27.2.
      - name: Quarantined app tests
        id: quarantine
        continue-on-error: true
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building -scheme Flipcash \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/app" \
            -parallel-testing-enabled NO \
            -only-testing:"FlipcashTests/AttachPanelPlacementTests/openPanel_sitsAbovePlus()" \
            -resultBundlePath "${{ runner.temp }}/Quarantined.xcresult"

      # FlipcashUITests needs UI-test account access keys that live in
      # secrets.local.xcconfig, which CI does not have, so authenticated tests skip
      # themselves. Only the signed-out smoke test that needs no network is run. The
      # .maestro flows all start from the login deeplink and need the same key, so
      # they are not run. continue-on-error until it has a record of passing on a
      # hosted simulator; XCUITest on shared runners is slow to start and flaky. The
      # step timeout keeps a hung launch from running out the job's clock, which
      # continue-on-error would not forgive.
      - name: UI smoke tests
        id: ui
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          xcodebuild test-without-building -scheme Flipcash \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/app" \
            -only-testing:FlipcashUITests/MnemonicEntrySmokeTests \
            -resultBundlePath "${{ runner.temp }}/UISmoke.xcresult"

      # Swift Testing's Issue.record messages reach the result bundle and nowhere else, so a
      # failure otherwise has to be reconstructed from "Test case ... failed" lines.
      # Uploaded for the UI step too, which by design leaves the job green.
      - name: Result bundles
        if: failure() || steps.ui.outcome == 'failure' || steps.quarantine.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: app-xcresult
          path: |
            ${{ runner.temp }}/AppTests.xcresult
            ${{ runner.temp }}/Quarantined.xcresult
            ${{ runner.temp }}/UISmoke.xcresult
          if-no-files-found: ignore
          retention-days: 7
